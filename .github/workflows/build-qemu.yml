
name: Build QEMU for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-qemu.yml"

jobs:
  build-qemu:
    name: Build QEMU for Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout endvm
        uses: actions/checkout@v4

      - name: Checkout Termux package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
          path: termux-packages

      - name: Build QEMU
        working-directory: termux-packages
        run: |
          ./scripts/run-docker.sh ./build-package.sh -I qemu-system-x86-64-headless

      - name: Show generated packages
        working-directory: termux-packages
        run: |
          echo "Generated packages:"
          find output -type f -name '*.deb' -print
          test -n "$(find output -type f -name '*.deb' -print -quit)"

      - name: Prepare packages
        working-directory: termux-packages
        run: |
          mkdir -p ../qemu-artifacts
          find output -type f -name '*.deb' -exec cp -v {} ../qemu-artifacts/ \;

          cd ../qemu-artifacts

          for f in *; do
            [ -f "$f" ] || continue
            safe=$(printf '%s' "$f" | sed 's/:/_/g')

            if [ "$safe" != "$f" ]; then
              mv "$f" "$safe"
            fi
          done

          echo "Packages ready for upload:"
          ls -lh

          test -n "$(find . -type f -name '*.deb' -print -quit)"

      - name: Upload QEMU packages
        uses: actions/upload-artifact@v4
        with:
          name: endvm-qemu-android-arm64
          path: qemu-artifacts/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          
