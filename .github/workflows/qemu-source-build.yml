
name: Build QEMU Android ARM64

on:
  workflow_dispatch:
    inputs:
      qemu_version:
        description: 'QEMU version'
        required: true
        default: '9.2.2'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      API_LEVEL: 28
      PREFIX: ${{ github.workspace }}/android-deps

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build meson \
            python3 python3-pip pkg-config \
            wget curl flex bison automake autoconf \
            libtool gettext texinfo autopoint \
            gcc g++ file

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Setup Android compiler
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/aarch64-linux-android28-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/llvm-strip" >> "$GITHUB_ENV"

          test -x "$TOOLCHAIN/aarch64-linux-android28-clang"

      - name: Download QEMU
        run: |
          VERSION="${{ github.event.inputs.qemu_version }}"
          wget "https://download.qemu.org/qemu-${VERSION}.tar.xz"
          tar -xf "qemu-${VERSION}.tar.xz"
          mv "qemu-${VERSION}" qemu-src

      - name: Configure QEMU
        working-directory: qemu-src
        run: |
          ./configure \
            --cc="$CC" \
            --cxx="$CXX" \
            --host-cc=gcc \
            --target-list=x86_64-softmmu \
            --disable-werror \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-vnc \
            --disable-curl \
            --disable-docs \
            --disable-capstone \
            --disable-fdt

      - name: Build QEMU
        working-directory: qemu-src
        run: |
          ninja -C build -j2

      - name: Check binary
        run: |
          test -f qemu-src/build/qemu-system-x86_64
          "$STRIP" qemu-src/build/qemu-system-x86_64
          file qemu-src/build/qemu-system-x86_64
          readelf -h qemu-src/build/qemu-system-x86_64

      - name: Upload QEMU
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ github.event.inputs.qemu_version }}-android-arm64
          path: qemu-src/build/qemu-system-x86_64
          if-no-files-found: error
          
